[project]
name = "lab-05-space-invaders-instructor"
version = "0.1.0"
description = "Instructor solution for CS101 Lab 05: Python modules"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.3,<3",
]

[project.scripts]
space-invaders = "space_invaders.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/space_invaders"]
